<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AIRP Studio</title>
    <style>
    :root {
      --bg: #f8fafc;
      --border: #e2e8f0;
      --surface: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --accent: #0284c7;
      color-scheme: light dark;
    }
    * {
      box-sizing: border-box;
    }
    body {
      display: grid;
      grid-template-rows: auto 1fr;
      height: 100vh;
      margin: 0;
      font:
        14px / 1.5 -apple-system,
        "Segoe UI",
        "PingFang SC",
        sans-serif;
      color: var(--text);
      background: var(--bg);
    }
    header {
      display: flex;
      gap: 12px;
      align-items: center;
      padding: 10px 16px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }
    header strong {
      font-size: 15px;
    }
    button {
      padding: 5px 12px;
      color: inherit;
      cursor: pointer;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
    }
    button:hover {
      color: var(--accent);
      border-color: var(--accent);
    }
    #status {
      margin-left: auto;
      font-size: 13px;
      color: var(--muted);
    }
    main {
      display: grid;
      grid-template-columns: 260px 1fr 320px;
      min-height: 0;
    }
    aside,
    #side {
      overflow: auto;
      background: var(--surface);
      border-right: 1px solid var(--border);
    }
    #side {
      border-right: 0;
      border-left: 1px solid var(--border);
    }
    h2 {
      padding: 10px 14px 6px;
      margin: 0;
      font-size: 12px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    ul {
      padding: 0 8px 12px;
      margin: 0;
      list-style: none;
    }
    li {
      margin-bottom: 2px;
    }
    li button {
      display: block;
      width: 100%;
      text-align: left;
      background: transparent;
      border-color: transparent;
    }
    li button[aria-current="true"] {
      color: var(--accent);
      border-color: var(--accent);
    }
    li small {
      display: block;
      font-size: 11px;
      color: var(--muted);
    }
    li .row-actions {
      display: flex;
      gap: 4px;
      margin: 2px 0 6px;
    }
    li .row-actions button {
      padding: 1px 7px;
      font-size: 11px;
      line-height: 1.4;
    }
    li .row-actions button:disabled {
      cursor: default;
      opacity: 0.35;
    }
    #blocks-tools {
      display: flex;
      gap: 6px;
      padding: 0 12px 8px;
    }
    #blocks-tools select {
      flex: 1;
      min-width: 0;
      padding: 4px 6px;
      font: inherit;
      font-size: 12px;
      color: inherit;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
    }
    #form fieldset {
      padding: 8px 10px;
      margin: 10px 0;
      border: 1px solid var(--border);
      border-radius: 8px;
    }
    #form legend {
      padding: 0 4px;
      font-size: 12px;
      color: var(--muted);
    }
    #form fieldset fieldset {
      margin: 6px 0;
      background: var(--bg);
    }
    .array-item {
      padding: 6px 8px;
      margin: 6px 0;
      border: 1px dashed var(--border);
      border-radius: 6px;
    }
    .array-item-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      color: var(--muted);
    }
    [data-add-item],
    [data-drop-item] {
      padding: 1px 7px;
      font-size: 11px;
    }
    #preview {
      width: 100%;
      height: 100%;
      background: #fff;
      border: 0;
    }
    #form {
      padding: 0 8px 16px;
    }
    #form label {
      display: block;
      margin: 10px 0 3px;
      font-size: 12px;
      color: var(--muted);
    }
    #form input,
    #form select,
    #form textarea {
      width: 100%;
      padding: 5px 7px;
      font: inherit;
      color: inherit;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
    }
    #form textarea {
      min-height: 72px;
      resize: vertical;
    }
    #form p {
      font-size: 12px;
      color: var(--muted);
    }
    #diagnostics {
      padding: 0 8px 16px;
    }
    #diagnostics li {
      padding: 7px 9px;
      font-size: 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
    }
    #diagnostics li[data-severity="error"] {
      border-color: #fca5a5;
    }
    #diagnostics code {
      font-size: 11px;
      color: var(--muted);
    }
    #drop {
      position: fixed;
      inset: 0;
      display: none;
      place-items: center;
      font-size: 18px;
      background: rgb(2 132 199 / 12%);
    }
    #drop[data-active="true"] {
      display: grid;
    }
    </style>
  </head>
  <body>
    <header>
      <strong>AIRP Studio</strong>
      <button id="open" type="button">打开 .airp.json</button>
      <button id="save" type="button" disabled>保存</button>
      <button id="save-as" type="button" disabled>另存为</button>
      <input id="file" type="file" accept=".json,application/json" hidden>
      <span id="status">拖入或打开一份 *.airp.json</span>
    </header>
    <main>
      <aside>
        <h2>积木块</h2>
        <div id="blocks-tools">
          <select id="add-type" aria-label="新增块的类型" disabled></select>
          <button id="add-block" type="button" disabled>＋ 新增</button>
        </div>
        <ul id="blocks"></ul>
      </aside>
      <iframe id="preview" title="预览"></iframe>
      <section id="side">
        <h2>字段</h2>
        <div id="form"><p>先选择左侧一个块。</p></div>
        <h2>校验</h2>
        <ul id="diagnostics"></ul>
      </section>
    </main>
    <div id="drop">松手即可打开</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
