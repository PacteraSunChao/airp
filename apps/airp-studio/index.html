<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light">
    <meta name="theme-color" content="#f4f2ee">
    <title>AIRP Studio</title>
  </head>
  <body>
    <div class="app">
      <header class="toolbar">
        <div class="brand" aria-label="AIRP Studio">
          <span class="brand-mark">AIRP</span>
          <span class="brand-sub">Studio</span>
        </div>

        <div class="toolbar-group">
          <button class="btn btn-ghost" type="button" id="new">新建</button>
          <button class="btn btn-ghost" type="button" id="import">导入</button>
          <button class="btn btn-ghost" type="button" id="save" disabled>
            保存
          </button>
          <button class="btn btn-ghost" type="button" id="export-json" disabled>
            导出 JSON
          </button>
          <button class="btn btn-ghost" type="button" id="validate" disabled>
            校验
          </button>
        </div>

        <div class="spacer"></div>
        <span class="status" id="status" title=""></span>
        <div class="toolbar-divider"></div>

        <div class="toolbar-group">
          <button
            class="btn btn-ghost active"
            type="button"
            id="toggle-fields"
            title="隐藏字段面板"
          >
            <i class="ri-layout-right-line" aria-hidden></i>
            字段
          </button>
          <button class="btn btn-ghost" type="button" id="fullscreen" disabled>
            全屏
          </button>
          <button class="btn btn-ghost" type="button" id="export-html" disabled>
            HTML
          </button>
          <button class="btn btn-primary" type="button" id="export-md" disabled>
            Markdown
          </button>
        </div>
      </header>

      <input
        type="file"
        id="file"
        accept=".json,.airp.json,application/json"
        hidden
      >

      <div class="workspace" id="workspace">
        <aside class="palette" id="palette" aria-label="积木块"></aside>

        <div class="editor-pane">
          <div class="canvas-wrap">
            <iframe class="canvas-frame" id="canvas" title="文档画布"></iframe>
          </div>
          <button
            type="button"
            class="preview-reopen"
            id="reopen-fields"
            hidden
          >
            打开字段面板
          </button>
        </div>

        <button
          class="resize-handle"
          type="button"
          id="resize"
          aria-label="调整字段面板宽度"
        ></button>

        <aside class="inspector" id="inspector" aria-label="字段面板"></aside>
      </div>
    </div>

    <div class="modal-backdrop" id="modal" hidden></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
